<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — re.shelf</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/listing-card.css">
  <style>
    .profile-header { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px; margin-bottom: 28px; display: flex; gap: 24px; align-items: center; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--primary); font-weight: 700; flex-shrink: 0; }
    .profile-info h2 { font-size: 22px; margin-bottom: 4px; }
    .profile-meta { font-size: 14px; color: var(--text-muted); }
    .profile-meta span { margin-right: 16px; }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <div class="page-content">
    <div class="container">
      <div class="profile-header">
        <div class="avatar" id="profile-avatar">A</div>
        <div class="profile-info">
          <h2 id="profile-name">Ahmed K.</h2>
          <div class="profile-meta">
            <span id="profile-uni">American University of Sharjah</span>
            <span id="profile-location">Sharjah area</span>
            <span id="profile-joined">Member since 2024</span>
          </div>
          <div id="profile-bio" style="margin-top:8px;font-size:14px;">Selling books from my engineering courses.</div>
        </div>
      </div>
      <div class="section-title">Active listings</div>
      <div class="listings-grid" id="profile-listings">
        <div class="listing-card" onclick="window.location.href='listing.html?id=1'">
          <div class="listing-card-img-placeholder">No image</div>
          <div class="listing-card-body">
            <div class="listing-card-title">Calculus: Early Transcendentals</div>
            <div class="listing-card-sub">AUS · Engineering</div>
            <div class="listing-card-meta">
              <span class="listing-card-price">AED 80</span>
              <span class="tag tag-active">Active</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer style="text-align:center;padding:20px;font-size:13px;color:var(--text-muted);border-top:1px solid var(--border);background:var(--white);">
    &copy; 2025 re.shelf &nbsp;|&nbsp;<a href="about.html">About</a> &nbsp;|&nbsp;<a href="faq.html">FAQ</a> &nbsp;|&nbsp;<a href="legal.html">Legal</a>
  </footer>
  <script src="../js/utils.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
