<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit listing — re.shelf</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <style>
    .form-card { max-width: 620px; margin: 0 auto; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 36px; }
    .form-card h2 { font-size: 22px; margin-bottom: 24px; }
    .form-row { display: flex; gap: 16px; }
    .form-row .form-group { flex: 1; }
    .danger-zone { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); }
    .danger-zone h3 { font-size: 16px; margin-bottom: 12px; color: var(--danger); }

    /* ── Image upload ── */
    .image-upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      background: var(--secondary);
    }
    .image-upload-area:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .image-upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .upload-icon { font-size: 28px; margin-bottom: 8px; color: var(--text-muted); }
    .upload-label { font-size: 14px; color: var(--text-muted); line-height: 1.5; }
    .upload-label strong { color: var(--primary); }

    /* Preview shown when an image exists (existing or newly chosen) */
    .image-preview-wrap {
      display: none;
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
    }
    .image-preview-wrap img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      display: block;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .image-preview-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .image-preview-actions button {
      font-size: 13px;
      padding: 4px 12px;
    }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <div class="page-content">
    <div class="container">
      <div class="form-card">
        <h2>Edit listing</h2>

        <!-- ── Image upload / replace ── -->
        <!--
          edit-listing.js loads the existing image (if any) into the preview on
          page load. The seller can click "Change photo" to pick a new file,
          or "Remove photo" to clear it entirely.
          The final image value (new base64, existing URL, or null) is sent
          with PUT /api/listings/:id when "Save changes" is clicked.
        -->
        <div class="form-group">
          <label>Photo (optional)</label>

          <!-- Drop-zone: hidden when a preview is showing -->
          <div class="image-upload-area" id="upload-area">
            <input type="file" id="image-input" accept="image/*">
            <div class="upload-icon">📷</div>
            <div class="upload-label">
              <strong>Click to upload</strong> a photo of your item<br>
              JPG, PNG or WEBP · max 5 MB
            </div>
          </div>

          <!-- Preview: shown when the listing already has an image, or after a new one is chosen -->
          <div class="image-preview-wrap" id="preview-wrap">
            <img id="image-preview" src="" alt="Preview">
            <div class="image-preview-actions">
              <!--
                "Change photo" re-shows the file input while keeping the preview visible
                until a new file is actually chosen.
              -->
              <label class="btn btn-outline" style="cursor:pointer;font-size:13px;padding:4px 12px;">
                Change photo
                <input type="file" id="image-replace-input" accept="image/*" style="display:none;">
              </label>
              <!-- "Remove photo" clears the image entirely -->
              <button class="btn btn-outline" id="remove-image">Remove photo</button>
            </div>
          </div>
        </div>

        <!-- Same fields as create-listing, pre-filled via edit-listing.js -->
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" placeholder="e.g. Calculus: Early Transcendentals">
        </div>
        <div class="form-group">
          <label>Author</label>
          <input type="text" id="author" placeholder="e.g. James Stewart">
        </div>
        <div class="form-group">
          <label>ISBN (optional)</label>
          <input type="text" id="isbn">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>University</label>
            <select id="uni">
              <option value="">Select university</option>
              <option>American University of Sharjah</option>
              <option>University of Sharjah</option>
              <option>Khalifa University</option>
              <option>University of Dubai</option>
              <option>Zayed University</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Subject</label>
            <input type="text" id="subject" placeholder="e.g. Engineering, Business...">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Resource type</label>
            <select id="type">
              <option>Textbook</option>
              <option>Notes</option>
              <option>Lab Manual</option>
              <option>Past Papers</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Price (AED)</label>
            <input type="number" id="price" min="0">
          </div>
        </div>
        <div class="form-group">
          <label>Condition</label>
          <select id="condition">
            <option>Like new</option>
            <option>Good</option>
            <option>Fair</option>
            <option>Poor</option>
          </select>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="description" rows="4"></textarea>
        </div>
        <button class="btn btn-primary" onclick="handleSave()">Save changes</button>
        <div class="danger-zone">
          <h3>Danger zone</h3>
          <button class="btn btn-outline" onclick="handleMarkSold()" style="margin-right:10px;">Mark as sold</button>
          <button class="btn btn-danger" onclick="handleDelete()">Delete listing</button>
        </div>
      </div>
    </div>
  </div>
  <footer style="text-align:center;padding:20px;font-size:13px;color:var(--text-muted);border-top:1px solid var(--border);background:var(--white);">
    &copy; 2025 re.shelf &nbsp;|&nbsp;<a href="about.html">About</a> &nbsp;|&nbsp;<a href="faq.html">FAQ</a> &nbsp;|&nbsp;<a href="legal.html">Legal</a>
  </footer>
  <script src="../js/utils.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/edit-listing.js"></script>
</body>
</html>
