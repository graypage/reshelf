<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversation — re.shelf</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <style>
    .convo-layout { display: flex; flex-direction: column; height: calc(100vh - 180px); }
    .convo-header { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; }
    .convo-header a { color: var(--text-muted); font-size: 14px; }
    .convo-listing-info { font-size: 13px; color: var(--text-muted); }
    .convo-listing-title { font-weight: 600; color: var(--text); }
    .messages-area { flex: 1; overflow-y: auto; padding: 8px 0; }
    .message { display: flex; margin-bottom: 14px; }
    .message.mine { justify-content: flex-end; }
    .message-bubble { max-width: 65%; padding: 10px 15px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
    .message.theirs .message-bubble { background: var(--white); box-shadow: var(--shadow); border-bottom-left-radius: 4px; }
    .message.mine .message-bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
    .message-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-align: right; }
    .message-input-row { display: flex; gap: 10px; padding: 12px 0 0; border-top: 1px solid var(--border); }
    .message-input-row input { flex: 1; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 24px; font-size: 15px; font-family: var(--font); }
    .message-input-row input:focus { outline: none; border-color: var(--primary); }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <div class="page-content" style="padding:16px 0;">
    <div class="container">
      <div class="convo-header">
        <a href="inbox.html">&larr; Inbox</a>
        <div>
          <div id="convo-with" style="font-weight:600;">Sara M.</div>
          <div class="convo-listing-info">Re: <span class="convo-listing-title" id="convo-listing">Calculus: Early Transcendentals</span></div>
        </div>
        <div style="margin-left:auto;">
          <a href="listing.html?id=1" style="font-size:13px;color:var(--primary);">View listing</a>
        </div>
      </div>
      <div class="convo-layout">
        <div class="messages-area" id="messages-area">
          <!-- Dummy messages -->
          <div class="message theirs">
            <div>
              <div class="message-bubble">Hi! Is the Calculus book still available?</div>
              <div class="message-time">10:30 AM</div>
            </div>
          </div>
          <div class="message mine">
            <div>
              <div class="message-bubble">Yes it is! Are you interested?</div>
              <div class="message-time">10:35 AM</div>
            </div>
          </div>
          <div class="message theirs">
            <div>
              <div class="message-bubble">Definitely. Can we meet at the AUS library tomorrow?</div>
              <div class="message-time">10:38 AM</div>
            </div>
          </div>
        </div>
        <div class="message-input-row">
          <input type="text" id="message-input" placeholder="Type a message...">
          <button class="btn btn-primary" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/utils.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/conversation.js"></script>
</body>
</html>
