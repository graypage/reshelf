<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listing — re.shelf</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <style>
    .listing-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .listing-image { background: var(--primary-light); border-radius: var(--radius); height: 320px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 14px; }
    .listing-info h1 { font-size: 24px; margin-bottom: 8px; }
    .listing-price { font-size: 28px; font-weight: 700; color: var(--primary); margin: 12px 0; }
    .listing-meta { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; }
    .listing-meta span { margin-right: 16px; }
    .listing-desc { font-size: 15px; line-height: 1.7; margin-bottom: 24px; }
    .seller-card { background: var(--secondary); border-radius: var(--radius); padding: 16px; margin-top: 20px; }
    .seller-card h3 { font-size: 15px; margin-bottom: 8px; }
    .action-buttons { display: flex; gap: 12px; }
    @media(max-width:700px){ .listing-layout{ grid-template-columns:1fr; } }
  </style>
</head>
<body>

  <!-- Navbar is injected here by navbar.js -->
  <div id="navbar"></div>

  <div class="page-content">
    <div class="container">

      <!-- Breadcrumb link back to the browse page -->
      <div style="margin-bottom:16px;font-size:14px;color:var(--text-muted);">
        <a href="../../index.html">Browse</a> &rsaquo; Listing detail
      </div>

      <div class="listing-layout">

        <!-- Left column: listing image (or placeholder if no image was uploaded) -->
        <div>
          <div class="listing-image" id="listing-image">No image uploaded</div>
        </div>

        <!-- Right column: all listing details, filled in by listing.js -->
        <div class="listing-info">

          <!-- Status tag (e.g. "Active" or "Sold") — set by listing.js -->
          <span class="tag" id="listing-status-tag"></span>

          <!-- Title, price, and metadata — all set by listing.js -->
          <h1 id="listing-title"></h1>
          <div class="listing-price" id="listing-price"></div>
          <div class="listing-meta">
            <span id="listing-uni"></span>
            <span id="listing-subject"></span>
            <span id="listing-type"></span>
            <span id="listing-date"></span>
          </div>

          <!-- Description — set by listing.js -->
          <div class="listing-desc" id="listing-desc"></div>

          <!--
            Action buttons — built entirely by listing.js AFTER the listing data loads.
            The JS figures out what to show based on who is viewing:
              - Owner sees an "Edit listing" button
              - Sold listings show a "no longer available" message
              - Everyone else sees "I'm interested" + "Message seller"
            Buttons are created in JS (not hardcoded here) so they always have
            the correct listing data when clicked.
          -->
          <div class="action-buttons" id="action-buttons"></div>

          <!-- Seller info card — filled in by listing.js -->
          <div class="seller-card">
            <h3>Seller</h3>
            <a id="seller-name" style="color:var(--primary);font-weight:600;"></a>
            <div id="seller-meta" style="font-size:13px;color:var(--text-muted);margin-top:4px;"></div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <footer style="text-align:center;padding:20px;font-size:13px;color:var(--text-muted);border-top:1px solid var(--border);background:var(--white);">
    &copy; 2025 re.shelf &nbsp;|&nbsp;<a href="about.html">About</a> &nbsp;|&nbsp;<a href="faq.html">FAQ</a> &nbsp;|&nbsp;<a href="legal.html">Legal</a>
  </footer>

  <!--
    Script load order matters:
      1. utils.js    — apiFetch(), getCurrentUser(), etc. Must load first.
      2. navbar.js   — builds the navbar HTML and calls updateNavAuth()
      3. listing.js  — fetches this listing from the API and fills in the page
  -->
  <script src="../js/utils.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/listing.js"></script>
</body>
</html>
