<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — re.shelf</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <style>
    .auth-card { max-width: 420px; margin: 60px auto; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 36px; }
    .auth-card h2 { margin-bottom: 24px; font-size: 22px; }
    .auth-switch { font-size: 14px; text-align: center; margin-top: 16px; color: var(--text-muted); }
    .auth-switch a { color: var(--primary); cursor: pointer; }
    .form-panel { display: none; }
    .form-panel.active { display: block; }
  </style>
</head>
<body>

  <div id="navbar"></div>

  <div class="page-content">
    <div class="auth-card">

      <!-- Login -->
      <div class="form-panel active" id="panel-login">
        <h2>Log in</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Log in</button>
        <div class="auth-switch mt-2">
          Don't have an account? <a onclick="showPanel('signup')">Sign up</a>
          &nbsp;·&nbsp; <a onclick="showPanel('reset')">Forgot password?</a>
        </div>
      </div>

      <!-- Sign up -->
      <div class="form-panel" id="panel-signup">
        <h2>Create account</h2>
        <div class="form-group">
          <label>Full name</label>
          <input type="text" id="signup-name" placeholder="Your name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="handleSignup()">Create account</button>
        <div class="auth-switch mt-2">Already have an account? <a onclick="showPanel('login')">Log in</a></div>
      </div>

      <!-- Password reset -->
      <div class="form-panel" id="panel-reset">
        <h2>Reset password</h2>
        <p class="text-muted mt-1" style="margin-bottom:20px;font-size:14px;">Enter your email and we'll send a reset link.</p>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reset-email" placeholder="you@example.com">
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="handleReset()">Send reset link</button>
        <div class="auth-switch mt-2"><a onclick="showPanel('login')">Back to log in</a></div>
      </div>

    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
