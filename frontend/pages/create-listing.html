<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create listing — re.shelf</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <style>
    .form-card { max-width: 620px; margin: 0 auto; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 36px; }
    .form-card h2 { font-size: 22px; margin-bottom: 24px; }
    .form-row { display: flex; gap: 16px; }
    .form-row .form-group { flex: 1; }

    /* ── Image upload ── */
    .image-upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      background: var(--secondary);
    }
    .image-upload-area:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .image-upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .upload-icon {
      font-size: 28px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    .upload-label {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .upload-label strong {
      color: var(--primary);
    }

    /* Preview shown after an image is chosen */
    .image-preview-wrap {
      display: none;
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 0;
    }
    .image-preview-wrap img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      display: block;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .image-preview-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 16px;
      line-height: 28px;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }
    .image-preview-remove:hover { background: rgba(0,0,0,0.8); }
  </style>
</head>
<body>

  <!-- Navbar is injected here by navbar.js -->
  <div id="navbar"></div>

  <div class="page-content">
    <div class="container">
      <div class="form-card">
        <h2>Create a listing</h2>

        <!-- ── Image upload ── -->
        <!--
          The upload area is a styled drop-zone; the hidden <input type="file">
          overlays it so clicking anywhere on the box opens the file picker.
          create-listing.js reads the chosen file, converts it to a base64
          data-URL, shows the preview, and stores it in a variable that gets
          sent with the POST /api/listings request.
        -->
        <div class="form-group">
          <label>Photo (optional)</label>

          <div class="image-upload-area" id="upload-area">
            <input type="file" id="image-input" accept="image/*">
            <div class="upload-icon">📷</div>
            <div class="upload-label">
              <strong>Click to upload</strong> a photo of your item<br>
              JPG, PNG or WEBP · max 5 MB
            </div>
          </div>

          <div class="image-preview-wrap" id="preview-wrap">
            <img id="image-preview" src="" alt="Preview">
            <button class="image-preview-remove" id="remove-image" title="Remove image">✕</button>
          </div>
        </div>

        <!-- Title: the name of the book or resource being sold -->
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" placeholder="e.g. Calculus: Early Transcendentals">
        </div>

        <!-- Author: optional, mainly useful for textbooks -->
        <div class="form-group">
          <label>Author</label>
          <input type="text" id="author" placeholder="e.g. James Stewart">
        </div>

        <!-- ISBN: optional, helps buyers verify the exact edition -->
        <div class="form-group">
          <label>ISBN (optional)</label>
          <input type="text" id="isbn" placeholder="e.g. 978-1-305-27177-1">
        </div>

        <div class="form-row">

          <!--
            University: pre-filled by create-listing.js using the seller's
            saved university from their profile (GET /api/profile).
          -->
          <div class="form-group">
            <label>University</label>
            <select id="uni">
              <option value="">Select university</option>
              <option>American University of Sharjah</option>
              <option>University of Sharjah</option>
              <option>Khalifa University</option>
              <option>University of Dubai</option>
              <option>Zayed University</option>
              <option>Other</option>
            </select>
          </div>

          <!--
            Subject: free-text field because subjects vary too much between
            universities to be a fixed list.
          -->
          <div class="form-group">
            <label>Subject</label>
            <input type="text" id="subject" placeholder="e.g. Engineering, Business...">
          </div>

        </div>

        <div class="form-row">

          <!-- Resource type: what kind of material is being sold -->
          <div class="form-group">
            <label>Resource type</label>
            <select id="type">
              <option>Textbook</option>
              <option>Notes</option>
              <option>Lab Manual</option>
              <option>Past Papers</option>
              <option>Other</option>
            </select>
          </div>

          <!-- Price in AED -->
          <div class="form-group">
            <label>Price (AED)</label>
            <input type="number" id="price" placeholder="e.g. 80" min="0">
          </div>

        </div>

        <!-- Condition: how worn or new the item is -->
        <div class="form-group">
          <label>Condition</label>
          <select id="condition">
            <option>Like new</option>
            <option>Good</option>
            <option>Fair</option>
            <option>Poor</option>
          </select>
        </div>

        <!-- Description: free text for any extra details -->
        <div class="form-group">
          <label>Description</label>
          <textarea id="description" rows="4" placeholder="Describe the item — any highlights, missing pages, edition info..."></textarea>
        </div>

        <!--
          "Post listing" calls handleCreateListing() in create-listing.js,
          which reads all the field values above and sends them to POST /api/listings
        -->
        <button class="btn btn-primary" onclick="handleCreateListing()">Post listing</button>

      </div>
    </div>
  </div>

  <footer style="text-align:center;padding:20px;font-size:13px;color:var(--text-muted);border-top:1px solid var(--border);background:var(--white);">
    &copy; 2025 re.shelf &nbsp;|&nbsp;<a href="about.html">About</a> &nbsp;|&nbsp;<a href="faq.html">FAQ</a> &nbsp;|&nbsp;<a href="legal.html">Legal</a>
  </footer>

  <!--
    Script load order:
      1. utils.js          — apiFetch(), getCurrentUser(), requireAuth(), etc.
      2. navbar.js         — injects the navbar
      3. create-listing.js — pre-fills university from profile, handles form submit
  -->
  <script src="../js/utils.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/create-listing.js"></script>
</body>
</html>
