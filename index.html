<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse — re.shelf</title>
  <link rel="stylesheet" href="frontend/css/global.css">
  <link rel="stylesheet" href="frontend/css/navbar.css">
  <link rel="stylesheet" href="frontend/css/listing-card.css">
  <style>
    .hero { text-align: center; padding: 50px 0 30px; }
    .hero h1 { font-size: 36px; color: var(--primary); margin-bottom: 10px; }
    .hero p  { color: var(--text-muted); margin-bottom: 30px; }
    .search-bar { display: flex; gap: 10px; max-width: 600px; margin: 0 auto 12px; }
    .search-bar input { flex: 1; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 15px; font-family: var(--font); }
    .search-bar input:focus { outline: none; border-color: var(--primary); }
    .advanced-toggle { text-align: center; font-size: 14px; color: var(--primary); cursor: pointer; margin-bottom: 20px; }
    .advanced-filters { display: none; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; max-width: 600px; margin: 0 auto 30px; }
    .advanced-filters.open { display: block; }
    .filters-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .filters-row .form-group { flex: 1; min-width: 150px; }
    .section-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- Navbar is injected here by navbar.js -->
  <div id="navbar"></div>

  <div class="page-content">
    <div class="container">

      <!-- ── Hero / Search section ── -->
      <div class="hero">
        <h1>Re.shelf</h1>
        <p>Buy and sell second-hand academic resources with students near you.</p>

        <!--
          Search bar — the input and button call handleSearch() in index.js.
          handleSearch() reads this input along with the filter dropdowns below
          and sends a GET request to /api/listings?q=...&uni=...&subject=...&type=...
        -->
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search by title, author, ISBN...">
          <button class="btn btn-primary" onclick="handleSearch()">Search</button>
        </div>

        <!--
          "Advanced search" toggle — clicking this calls toggleAdvanced() in index.js
          which shows/hides the filter dropdowns below
        -->
        <div class="advanced-toggle" onclick="toggleAdvanced()">&#9660; Advanced search</div>

        <!-- Advanced filter dropdowns — hidden by default, shown by toggleAdvanced() -->
        <div class="advanced-filters" id="advanced-filters">
          <div class="filters-row">

            <div class="form-group">
              <label>University</label>
              <select id="filter-uni">
                <option value="">All universities</option>
                <option>American University of Sharjah</option>
                <option>University of Sharjah</option>
                <option>Khalifa University</option>
                <option>University of Dubai</option>
                <option>Zayed University</option>
              </select>
            </div>

            <div class="form-group">
              <label>Resource type</label>
              <select id="filter-type">
                <option value="">All types</option>
                <option>Textbook</option>
                <option>Notes</option>
                <option>Lab Manual</option>
                <option>Past Papers</option>
                <option>Other</option>
              </select>
            </div>

          </div>

          <!-- Clicking "Apply filters" triggers the same handleSearch() function -->
          <button class="btn btn-primary" onclick="handleSearch()">Apply filters</button>
        </div>
      </div>

      <!-- ── Listings grid ── -->
      <!--
        This div starts empty. When the page loads, index.js calls loadListings()
        which fetches all active listings from GET /api/listings and builds
        the listing cards dynamically and inserts them here.

        Each card links to frontend/pages/listing.html?id=X so clicking it
        opens the full listing detail page.
      -->
      <div class="section-title">Recent listings</div>
      <div class="listings-grid" id="listings-grid"></div>

    </div>
  </div>

  <footer style="text-align:center;padding:20px;font-size:13px;color:var(--text-muted);border-top:1px solid var(--border);background:var(--white);">
    &copy; 2025 re.shelf &nbsp;|&nbsp;
    <a href="frontend/pages/about.html">About</a> &nbsp;|&nbsp;
    <a href="frontend/pages/faq.html">FAQ</a> &nbsp;|&nbsp;
    <a href="frontend/pages/legal.html">Legal</a>
  </footer>

  <!--
    Script load order:
      1. utils.js  — apiFetch(), getCurrentUser(), etc. Must load first.
      2. navbar.js — injects the navbar HTML and shows login/logout buttons
      3. index.js  — fetches and renders the listings grid, handles search
  -->
  <script src="frontend/js/utils.js"></script>
  <script src="frontend/js/navbar.js"></script>
  <script src="frontend/js/index.js"></script>
</body>
</html>
